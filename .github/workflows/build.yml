name: windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: silent ui and file lifecycle checks
        shell: pwsh
        run: ./scripts/verify-ui.ps1
      - name: package app and reference plugin
        shell: pwsh
        run: ./scripts/package.ps1
